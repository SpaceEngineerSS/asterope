[package]
name = "asterope-wasm"
description = "WebAssembly bindings for the Asterope star tracker core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asterope-core = { workspace = true, features = ["validation"] }
asterope-io.workspace = true
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
